name: Automated Tests

on: pull_request

jobs:
  jest:
    name: Jest Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18.0"

      # para não atualizar as dependências com o npm install, executando o package-lock.json sem atualiza-lo
      - run: npm ci

      - run: npm test
