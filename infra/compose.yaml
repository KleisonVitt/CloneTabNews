services:
  database:
    container_name: "postgres-dev"
    image: "postgres:16-alpine3.23"
    env_file:
      - ../.env.development
    ports:
      - "5434:5432"
  # host : container
  mailcatcher:
    container_name: "mailcatcher-dev"
    image: "sj26/mailcatcher"
    ports:
      - "1025:1025" # SMTP Server
      - "1080:1080" # Mailcatcher Client
